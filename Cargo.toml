[workspace]
resolver = "2"
members = [
  "crates/mousse-net-core",
  "crates/mousse-sim",
  "crates/mousse-net-io",
  "crates/mousse-helper",
  "crates/mousse-check",
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
