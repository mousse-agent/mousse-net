[workspace]
resolver = "2"
members = [
  "crates/mousse-net-core",
  "crates/mousse-sim",
  "crates/mousse-net-io",
  "crates/mousse-helper",
  "crates/mousse-check",
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "deny"
# Must-fail controls (spec/vectors/README.md, checks/phase0.toml). Each plants
# one bug so the tests can be shown to fail. Debug builds only. The first four
# are in mousse-net-core, the rest in mousse-net-io and mousse-helper.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mousse_control, values("break-session-cert", "break-authz", "break-raw-signature", "break-cpace", "skip-pin-check", "keep-removed-grant", "shared-endpoint-state", "allow-break-env"))'] }

[profile.release]
lto = true
codegen-units = 1
strip = true
