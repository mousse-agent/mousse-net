[workspace]
resolver = "2"
members = [
  "crates/mousse-net-core",
  "crates/mousse-sim",
  "crates/mousse-net-io",
  "crates/mousse-helper",
  "crates/mousse-check",
  "crates/mousse-relay",
  "crates/mousse-relay-plus",
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "deny"
# Must-fail controls (spec/vectors/README.md, checks/phase0.toml). Each plants
# one bug so the tests can be shown to fail. Debug builds only. The first five
# are in mousse-net-core, the rest in mousse-net-io and mousse-helper.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mousse_control, values("break-session-cert", "break-authz", "break-raw-signature", "break-cpace-confirm", "break-cpace-sid", "skip-pin-check", "keep-removed-grant", "shared-endpoint-state", "allow-break-env", "no-stream-cap", "read-without-credit", "fifo-writer", "fin-overtakes", "no-revoke-journal", "stop-on-mismatch", "public-routes", "no-rediscovery", "dial-again-behind", "no-preauth-budget", "shared-preauth-pool", "ws-slot-after-headers", "ipc-unbounded-line", "ipc-handoff-drops-buffer", "join-only-frees-slot", "join-only-outlives-invitation", "fence-at-accept-only", "fence-tcp-only", "enroll-while-paused", "repair-skips-slot", "repair-skips-fence", "limits-raise", "no-endpoint-lock", "no-pin-relay", "relay-skip-allow-set", "relay-refuse-early", "relay-successor-unchecked", "relay-no-preaccept-budget", "relay-persist-allow-set", "marker-in-splice", "marker-in-relay-memory", "per-socket-rate", "accept-replayed-lease", "ignore-admission-expiry", "close-funded-at-expiry", "refuse-expired-reregister", "expiry-on-relay-wall-clock", "relay-dumpable", "fifo-egress", "relay-clock-pauses-in-sleep", "removal-unsigned", "accept-any-signer", "ignore-owner", "ignore-grant-id", "resend-refused", "auto-send-unknown", "new-request-id-on-retry", "no-prefetch", "pause-all-classes", "fund-two-relays", "keep-removed-slot", "unpinned-manifest", "trust-from-plus", "shared-caller-key", "close-all-on-removal", "manifest-unapproved", "blanket-approval", "no-pairing-recovery", "recovery-makes-grant", "no-overlap", "relay-chain-full-closes", "relay-overlap-ignored", "chain-full-ignored", "stale-manifest-dropped", "prompt-on-key-change", "disallow-keeps-paths", "remove-keeps-sessions", "accept-legs-unbounded", "ws-allow-origin", "plain-ws-off-loopback", "release-test-root", "peer-ssh-routes", "loopback-routes", "plain-ws-from-ticket", "unapproved-public", "unapproved-last-route", "upgrade-trusts-routes", "resolve-again", "unlisted-allowed", "stale-renewal-routes", "unbounded-candidates", "ssh-races-lan", "bind-all-lan-off", "admit-ungranted", "join-only-streams", "inbound-before-live", "skip-code-confirm", "host-attempts-reset-on-reconnect", "invitation-survives-exhaustion", "same-code-after-failure", "pin-stored-memory-only", "journal-pins-link", "fabricate-pending-kind2", "joiner-records-in-memory", "link-accepts-kind1", "no-completion-record", "done-pin-only", "replay-after-removal", "no-tag-quota", "join-ignores-removal", "removal-leaves-pending", "accept-new-host-key", "user-config-in-pipe", "trust-unprobed-key", "pipe-no-token", "no-preamble-skip", "pipe-outlives-helper", "window-per-route", "approval-uses-invitation-role", "role-edit-ignores-revision", "role-edit-keeps-reverse-path", "restricted-grant-served-to-legacy-app", "restricted-grant-opens-standalone-terminal", "demoted-owner-keeps-grants", "restricted-store-readable-by-old-helper", "role-edit-unfenced", "role-edit-while-paused", "demoted-signer-removes", "role-edit-keeps-queued-announcement", "role-edit-delivers-on-closing-path", "grant-served-while-not-serving", "suspended-reads-as-revoked", "answer-role-sticks-to-invitation", "grant-from-stale-connection", "connected-grant-upgrades-existing", "connected-grant-trusts-request-identity"))'] }

[profile.release]
lto = true
codegen-units = 1
strip = true
