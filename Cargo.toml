[workspace]
resolver = "2"
members = [
  "crates/mousse-net-core",
  "crates/mousse-sim",
  "crates/mousse-net-io",
  "crates/mousse-helper",
  "crates/mousse-check",
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "deny"
# Must-fail controls in mousse-net-core (spec/vectors/README.md). Each plants
# one bug so the vector tests can be shown to fail. Debug builds only.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mousse_control, values("break-session-cert", "break-authz", "break-raw-signature", "break-cpace"))'] }

[profile.release]
lto = true
codegen-units = 1
strip = true
