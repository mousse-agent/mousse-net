[package]
name = "mousse-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Seeded, deterministic simulator that drives the mousse-net core state machines through drills."

[lints]
workspace = true

[[bin]]
name = "mousse-sim"
path = "src/main.rs"

[features]
# Run core's insecure stand-in exchange instead of CPace (speed comparisons).
insecure-exchange = ["mousse-net-core/insecure-test-exchange"]

[dependencies]
mousse-net-core = { path = "../mousse-net-core" }
rand_core = { version = "=0.10.1", default-features = false }
rand_chacha = { version = "=0.10.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
