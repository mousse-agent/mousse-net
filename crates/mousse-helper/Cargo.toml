[package]
name = "mousse-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "The Mousse desktop helper and CLI: pairing, grants and terminal channels over mousse-net."

[lints]
workspace = true

[dependencies]
mousse-net-core = { path = "../mousse-net-core" }
mousse-net-io = { path = "../mousse-net-io" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "sync", "time", "signal"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
portable-pty = "=0.9.0"
qrcode = { version = "=0.14.1", default-features = false }
crossterm = { version = "=0.29.0", default-features = false, features = ["windows"] }
if-addrs = "=0.15.0"
gethostname = "=1.1.0"
zeroize = { version = "=1.9.2", default-features = false, features = ["alloc"] }

[features]
# Test builds only (refused in release builds): `join` and `slice-check`
# take `--in-person`, so a ticket given on the command line counts as
# scanned from the host's screen. Otherwise only the app's scanner can say
# that.
test-in-person = []

[dev-dependencies]
serde_json = "=1.0.154"
# Reads the terminal QR code in tests/headless.rs, as a phone's scanner would.
rqrr = { version = "=0.11.0", default-features = false }
# The relay tests run the real relay in the test process.
mousse-relay = { path = "../mousse-relay" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }

[[test]]
name = "loopback"
required-features = ["test-in-person"]

[[test]]
name = "headless"
required-features = ["test-in-person"]
