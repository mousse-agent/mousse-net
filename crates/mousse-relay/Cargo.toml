[package]
name = "mousse-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Self-hosted Mousse relay: admits calls only by the target's own allow-set and splices connections it cannot read."

[lints]
workspace = true

[dependencies]
mousse-net-core = { path = "../mousse-net-core" }
mousse-relay-plus = { path = "../mousse-relay-plus" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["logging", "aws_lc_rs"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "logging", "aws_lc_rs", "prefer-post-quantum"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
httparse = "=1.10.1"
rand_core = { version = "=0.10.1", default-features = false }
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
zeroize = { version = "=1.9.2", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
clap = { version = "=4.6.7", features = ["derive", "env"] }
sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
rand_chacha = "=0.10.0"
mousse-net-io = { path = "../mousse-net-io" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
