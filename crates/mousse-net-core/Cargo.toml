[package]
name = "mousse-net-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Mousse networking state machines: identity, pairing, grants, session, mux. No I/O; builds for wasm32."

[lints]
workspace = true

[dependencies]
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
curve25519-dalek = { version = "=5.0.0", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
sha2 = { version = "=0.11.1", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
hkdf = { version = "=0.13.0", default-features = false }
rand_core = { version = "=0.10.1", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.2", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
rand_chacha = "=0.10.0"
serde_json = "=1.0.154"
ecdsa = { version = "=0.17.0", features = ["der"] }

# Runs the tests on wasm32-unknown-unknown (under Node) with
# wasm-bindgen-test-runner 0.2.130 as the cargo runner.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[features]
# A stand-in code exchange for tests and the simulator. Not secure.
insecure-test-exchange = []
