[package]
name = "mousse-check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Owner test kit: runs each phase's checks and their must-fail controls, collects signed device results, prints one verdict."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mousse-check"
path = "src/main.rs"

[dependencies]
mousse-net-core = { path = "../mousse-net-core" }
mousse-net-io = { path = "../mousse-net-io" }
tokio = { version = "=1.54.1", features = ["rt", "net", "io-util", "macros", "sync", "time", "process"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["logging", "aws_lc_rs"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "logging", "aws_lc_rs", "prefer-post-quantum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.6"
getrandom = "=0.2.17"
sha2 = { version = "=0.11.1", default-features = false }
zeroize = { version = "=1.9.2", default-features = false, features = ["alloc"] }
