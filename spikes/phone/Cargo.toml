# Phase 0 spikes 3 and 4: the phone byte path and the phone lifecycle.
# Its own workspace, like spikes/tls-matrix, so the engine workspace is untouched.
[workspace]
resolver = "3"
members = ["rust", "bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.96"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
