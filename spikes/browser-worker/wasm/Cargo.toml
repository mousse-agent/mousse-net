[package]
name = "mousse-browser-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "mousse-net-core in a browser Worker: builds a session certificate signed by a WebCrypto identity key."

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mousse-net-core = { path = "../../../crates/mousse-net-core" }
wasm-bindgen = "=0.2.130"
zeroize = { version = "=1.9.2", default-features = false, features = ["alloc"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
