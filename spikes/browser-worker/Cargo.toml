[package]
name = "browser-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.96"
description = "Phase 0 spike 2: a browser Worker issues a session certificate with a WebCrypto identity key; a native verifier checks it."

# Its own workspace, like spikes/tls-matrix: the engine workspace excludes spikes.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "verify-worker-cert"
path = "src/bin/verify_worker_cert.rs"

[lints.rust]
unsafe_code = "deny"

[dependencies]
mousse-net-core = { path = "../../crates/mousse-net-core" }
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
rand_core = { version = "=0.10.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", features = ["sys_rng", "wasm_js"] }
wasm-bindgen = "=0.2.130"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "=1.0.154"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = false
