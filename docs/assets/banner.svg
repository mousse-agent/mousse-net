<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">mousse-net</title>
  <desc id="d">The open networking engine for Mousse: a few devices joined by encrypted links.</desc>

  <rect width="1280" height="320" rx="16" fill="#14161c"/>

  <!-- links -->
  <g fill="none" stroke="#3a4152" stroke-width="2" stroke-linecap="round">
    <path d="M800 212 L916 108"/>
    <path d="M916 108 L1052 176"/>
    <path d="M1052 176 L1168 92"/>
    <path d="M1052 176 L1128 258"/>
    <path d="M800 212 L940 252" stroke-dasharray="2 10"/>
    <path d="M940 252 L1052 176" stroke-dasharray="2 10"/>
  </g>

  <!-- the live path -->
  <path d="M800 212 L916 108 L1052 176" fill="none" stroke="#e8b98a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- nodes -->
  <g fill="#14161c" stroke="#8a93a6" stroke-width="2">
    <circle cx="1168" cy="92" r="9"/>
    <circle cx="1128" cy="258" r="9"/>
    <circle cx="940" cy="252" r="7"/>
  </g>
  <g fill="#14161c" stroke="#e8b98a" stroke-width="2.5">
    <circle cx="800" cy="212" r="12"/>
    <circle cx="916" cy="108" r="9"/>
    <circle cx="1052" cy="176" r="14"/>
  </g>
  <circle cx="800" cy="212" r="4" fill="#e8b98a"/>
  <circle cx="1052" cy="176" r="5" fill="#e8b98a"/>

  <!-- words -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="96" y="162" font-size="68" font-weight="600" fill="#f3f1ec" letter-spacing="-1.5">mousse<tspan fill="#e8b98a">-net</tspan></text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="98" y="210" font-size="24" fill="#aab1c0">The open networking engine for Mousse.</text>
    <text x="98" y="246" font-size="18" fill="#6f778a">Identity · pairing · grants · encrypted sessions · your own routes</text>
  </g>
</svg>
