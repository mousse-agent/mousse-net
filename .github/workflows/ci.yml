name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown && rustup default 1.96.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: engine-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check -p mousse-net-core --target wasm32-unknown-unknown --locked
