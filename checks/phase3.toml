# Phase 3: self-hosted relay (docs/PLAN.md, "Phase 3"; docs/phase34-design.md
# Part G.1).
#
# Owner check: `mousse-check phase3` shows PASS in every target cell and no
# INCOMPLETE. Format: checks/README.md.
#
# This file holds the relay engine's checks (E-R0, E-R1, E-R2, E-R7). The
# helper and release slices add theirs (phase3.relay-routes,
# phase3.relay-rotation, phase3.headless, phase3.reproducible,
# phase3.install, phase3.vps-demo, phase3.outside-template) when they land.

phase = "phase3"
title = "Self-hosted relay"
plan = "docs/PLAN.md#phase-3"

# ---------------------------------------------------------------------------
# Relay admission: the core machine and its vectors, then the relay over real
# connections on loopback.

[[check]]
id = "phase3.relay-admission"
title = "Relay admission: every relay vector, the timing rule, wrong relay key and wrong peer identity fail before data, SUCCESSOR needs the current key"
plan = "docs/phase34-design.md C.2, C.3, G.1; spec/relay.md"
targets = ["windows-x64", "macos-arm64", "linux-x64"]
judge = "cargo-test"
min_tests = 185
device_steps = "on that machine: mousse-check run phase3.relay-admission --sign-with <key>, then the same with --control"

[[check.local]]
target = "windows-x64"
host = "windows-x86_64"
command = ["cargo", "test", "-p", "mousse-net-core", "-p", "mousse-relay", "--no-fail-fast", "--lib", "--test", "vectors", "--test", "relay_admission"]

[[check.local]]
target = "macos-arm64"
host = "macos-aarch64"
command = ["cargo", "test", "-p", "mousse-net-core", "-p", "mousse-relay", "--no-fail-fast", "--lib", "--test", "vectors", "--test", "relay_admission"]

[[check.local]]
target = "linux-x64"
host = "linux-x86_64"
command = ["cargo", "test", "-p", "mousse-net-core", "-p", "mousse-relay", "--no-fail-fast", "--lib", "--test", "vectors", "--test", "relay_admission"]

[[check.control]]
name = "skip-allow-set"
breaks = "the relay admits any caller of a handle that has an allow-set"
env = { RUSTFLAGS = '--cfg mousse_control="relay-skip-allow-set"' }

[[check.control]]
name = "refuse-early"
breaks = "the relay answers a refused call at once instead of at the refusal deadline"
env = { RUSTFLAGS = '--cfg mousse_control="relay-refuse-early"' }

[[check.control]]
name = "no-pin-relay"
breaks = "the native client accepts any relay key"
env = { RUSTFLAGS = '--cfg mousse_control="no-pin-relay"' }

[[check.control]]
name = "successor-unchecked"
breaks = "SUCCESSOR does not check the current key's proof"
env = { RUSTFLAGS = '--cfg mousse_control="relay-successor-unchecked"' }

[[check]]
id = "phase3.relay-reboot"
title = "Relay reboot: identity kept, calls refused until re-registration and an allow-set push, removal survives, one process per state directory"
plan = "docs/phase34-design.md C.1 rule 10, G.1"
targets = ["linux-x64", "macos-arm64"]
judge = "cargo-test"
min_tests = 1
device_steps = "on that machine: mousse-check run phase3.relay-reboot --sign-with <key>, then the same with --control"

[[check.local]]
target = "linux-x64"
host = "linux-x86_64"
command = ["cargo", "test", "-p", "mousse-relay", "--no-fail-fast", "--test", "relay_reboot"]

[[check.local]]
target = "macos-arm64"
host = "macos-aarch64"
command = ["cargo", "test", "-p", "mousse-relay", "--no-fail-fast", "--test", "relay_reboot"]

[[check.control]]
name = "persist-allow-set"
breaks = "the relay stores the first allow-set of each handle and reapplies it after a reboot"
env = { RUSTFLAGS = '--cfg mousse_control="relay-persist-allow-set"' }

[[check]]
id = "phase3.relay-limits"
title = "Relay limits: per address, per-handle accept legs, per-caller circuits, queue, first-message wait, egress and pre-accept budget; tighten-only variables refuse to loosen"
plan = "docs/phase34-design.md H.1, G.1; spec/relay.md 13"
targets = ["linux-x64", "windows-x64"]
judge = "cargo-test"
min_tests = 11
device_steps = "on that machine: mousse-check run phase3.relay-limits --sign-with <key>, then the same with --control"

[[check.local]]
target = "windows-x64"
host = "windows-x86_64"
command = ["cargo", "test", "-p", "mousse-relay", "--no-fail-fast", "--lib", "--test", "relay_limits"]

[[check.local]]
target = "linux-x64"
host = "linux-x86_64"
command = ["cargo", "test", "-p", "mousse-relay", "--no-fail-fast", "--lib", "--test", "relay_limits"]

[[check.control]]
name = "no-preaccept-budget"
breaks = "join circuits have no byte budget and no per-target cap"
env = { RUSTFLAGS = '--cfg mousse_control="relay-no-preaccept-budget"' }

# ---------------------------------------------------------------------------
# The simulator and the second implementation.

[[check]]
id = "phase3.sim-relay-admission"
title = "Simulator: relay admission over many seeds, across reboots and key rotation"
plan = "docs/phase34-design.md F.1 E-R1 (mousse-sim admission seeds)"
targets = ["windows-x64"]
judge = "marker"
pass_marker = "PASS sim relay-admission"
fail_marker = "FAIL sim relay-admission"

[[check.local]]
target = "windows-x64"
host = "windows-x86_64"
command = ["cargo", "run", "--release", "-p", "mousse-sim", "--", "run", "relay-admission", "--seeds", "1000"]

[[check.control]]
name = "relay-early-answer"
breaks = "the simulated relay's timer runs ahead of its clock, so refused calls are answered before the deadline"
args = ["--bug", "relay-early-answer"]

[[check.control]]
name = "relay-stale-allow-set"
breaks = "the simulated relay reapplies a target's old allow-set when it registers after a reboot"
args = ["--bug", "relay-stale-allow-set"]

[[check]]
id = "phase3.relay-second-implementation"
title = "The independent TypeScript implementation passes every relay vector"
plan = "docs/phase34-design.md C.3 (\"replayed by an independent implementation from the spec alone\")"
targets = ["windows-x64"]
judge = "marker"
pass_marker = "PASS second-impl"
fail_marker = "FAIL second-impl"

# Needs `npm ci` once in interop/second-impl-ts.
[[check.local]]
target = "windows-x64"
host = "windows-x86_64"
cwd = "interop/second-impl-ts"
command = ["node", "--disable-warning=ExperimentalWarning", "test.mjs"]

[[check.control]]
name = "relay-allow-set"
breaks = "the second implementation's relay admits any caller of a handle that has an allow-set"
env = { MOUSSE_SECOND_BREAK = "relay-allow-set" }

# ---------------------------------------------------------------------------
# Privacy: the marker.

[[check]]
id = "phase3.marker"
title = "A marker sent through the relay inside the peer session is found 0 times in a capture of both legs, the relay's decrypted view and a relay memory sample"
plan = "docs/phase34-design.md G.1, B.16; spec/privacy.md \"Through a relay\""
targets = ["linux-x64"]
judge = "marker"
pass_marker = "PASS phase3.marker"
fail_marker = "FAIL phase3.marker"
device_steps = "in WSL (Linux): mousse-check run phase3.marker --sign-with <key>, then the same with --control"

[[check.local]]
target = "linux-x64"
host = "linux-x86_64"
command = ["cargo", "test", "-p", "mousse-relay", "--test", "marker", "--", "--nocapture"]

[[check.control]]
name = "marker-in-splice"
breaks = "packet positive control: the caller also sends the marker in the clear inside the splice and the relay runs without outer TLS, so the capture and the tap must find it"
env = { RUSTFLAGS = '--cfg mousse_control="marker-in-splice"' }
expect_reason = "packet"

[[check.control]]
name = "marker-in-relay-memory"
breaks = "memory positive control: the relay copies the marker into its heap, so the memory sample must find it"
env = { RUSTFLAGS = '--cfg mousse_control="marker-in-relay-memory"' }
expect_reason = "memory"

# ---------------------------------------------------------------------------
# Manual steps.

[[check]]
id = "phase3.relay-admission-review"
title = "Council sign-off of relay admission (Part C) before it freezes for relay protocol version 1"
plan = "docs/phase34-design.md C.4; checks/reviews/phase0-design-review.md"
targets = ["relay-admission"]
manual = true
steps = "review docs/phase34-design.md C.1 to C.3 and B.3, B.4, B.7 against spec/relay.md and spec/vectors/relay-admission.json; add the C.4 line to checks/reviews/phase0-design-review.md; attest with the reviewers and the review link"

[[check]]
id = "phase3.inspect"
title = "On a deployed relay, the kit prints the deployed hash against a local build, the log and the state directory"
plan = "docs/phase34-design.md G.1, B.16"
targets = ["self-hosted-relay"]
manual = true
steps = "on the relay machine: mousse-check relay-inspect --state <state dir> --binary <deployed mousse-relay> --local <locally built mousse-relay> --log <relay log>; it must end PASS relay-inspect; attest with the output"
