# Pairing flow, pull request 3: ending one direction with
# `grant.revoke_local` (docs/pairing-flow-design.md §6.1 and §11).
#
# Owner check: `mousse-check pairing-revoke` shows PASS in every target
# cell, with no INCOMPLETE. Format: checks/README.md.

phase = "pairing-revoke"
title = "Ending one direction of a pairing"
plan = "docs/pairing-flow-design.md#61-ending-one-direction-grant_revoke_local"

[[check]]
id = "pairing-revoke.revoke-local"
title = "A local revocation stops the peer's calls into this computer, also on a shared minor-3 connection, after a restart and through a failed save, while this computer keeps its own way to the peer; no data from the peer's calls reaches the app after the reply; no relay key or recovery entry of the grant outlives a crash or a race"
plan = "docs/pairing-flow-design.md §6.1 and §11"
targets = ["windows-x64", "macos-arm64", "linux-x64"]
min_tests = 14
local = [
  { target = "windows-x64", host = "windows-x86_64", command = ["cargo", "test", "-p", "mousse-helper", "--test", "app_revoke_local", "--no-fail-fast"] },
  { target = "macos-arm64", host = "macos-aarch64", command = ["cargo", "test", "-p", "mousse-helper", "--test", "app_revoke_local", "--no-fail-fast"] },
  { target = "linux-x64", host = "linux-x86_64", command = ["cargo", "test", "-p", "mousse-helper", "--test", "app_revoke_local", "--no-fail-fast"] },
]
control = [
  { name = "local-revoke-forgets-peer", breaks = "the outbound peer record, its approvals, relay secrets and completion record go with the grant", env = { RUSTFLAGS = '--cfg mousse_control="local-revoke-forgets-peer"' } },
  { name = "local-revoke-keeps-inbound-access", breaks = "the reply says removed but the grant survives and the peer still gets in", env = { RUSTFLAGS = '--cfg mousse_control="local-revoke-keeps-inbound-access"' } },
  { name = "no-revoke-journal", breaks = "the removal is not journaled, so a crash between change and save re-admits the peer", env = { RUSTFLAGS = '--cfg mousse_control="no-revoke-journal"' } },
]
