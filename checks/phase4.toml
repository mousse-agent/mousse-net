# Phase 4 (engine): the helper's Plus client, directory slots and the
# inbox, and "remove on all my hosts" (docs/phase34-design.md Part G.2).
#
# Owner check: `mousse-check phase4` shows PASS in every target cell, with
# no INCOMPLETE. Format: checks/README.md. Plus is the test stand-in on
# loopback until the Plus team's double replaces it; no real account is
# ever used.

phase = "phase4"
title = "Hosted relay, the helper's Plus client and remove on all my hosts"
plan = "docs/phase34-design.md#part-g-owner-checks"
# `local = [...]` and `control = [...]` are the inline form of [[check.local]] and [[check.control]].

[[check]]
id = "phase4.remove-everywhere"
title = "Grant lists to owners only; one removal per confirmed host and grant id; a stale grant id leaves the newer pairing; a grant learned later needs a second confirmation; a resend returns the journaled result; non-owner signers, wrong-owner grants and reused ids with other bytes are refused"
plan = "docs/phase34-design.md Part D and F.1 (E-L4)"
targets = ["windows-x64", "linux-x64"]
min_tests = 23
local = [
  { target = "windows-x64", host = "windows-x86_64", command = ["cargo", "test", "-p", "mousse-net-core", "-p", "mousse-helper", "--no-fail-fast", "removal"] },
  { target = "linux-x64", host = "linux-x86_64", command = ["cargo", "test", "-p", "mousse-net-core", "-p", "mousse-helper", "--no-fail-fast", "removal"] },
]
control = [
  { name = "accept-any-signer", breaks = "a removal signed by a device without an owner grant is applied", env = { RUSTFLAGS = '--cfg mousse_control="accept-any-signer"' } },
  { name = "ignore-owner", breaks = "a grant another owner authorized is removed", env = { RUSTFLAGS = '--cfg mousse_control="ignore-owner"' } },
  { name = "ignore-grant-id", breaks = "a removal for an older grant id removes the newer pairing", env = { RUSTFLAGS = '--cfg mousse_control="ignore-grant-id"' } },
  { name = "auto-send-unknown", breaks = "a grant the host lists after the user acted is removed without asking again", env = { RUSTFLAGS = '--cfg mousse_control="auto-send-unknown"' } },
  { name = "resend-refused", breaks = "a resend after a lost answer is refused instead of getting its journaled result", env = { RUSTFLAGS = '--cfg mousse_control="resend-refused"' } },
  { name = "removal-unsigned", breaks = "the removal record's signature is not checked", env = { RUSTFLAGS = '--cfg mousse_control="removal-unsigned"' } },
]

[[check]]
id = "phase4.helper-plus"
title = "Sign-in with a typed code survives a lost answer; account and usage shown from disk while Plus is down; lease request ids stored and reused across a restart; prefetch at the threshold with one current and one pending; bulk pauses alone on a failed refill; a refused block is presented again; a relay move releases before it funds the new relay"
plan = "docs/phase34-design.md A.3 to A.8, B.10, B.11 and F.1 (E-L2)"
targets = ["windows-x64", "macos-arm64"]
min_tests = 23
local = [
  { target = "windows-x64", host = "windows-x86_64", command = ["cargo", "test", "-p", "mousse-helper", "--no-fail-fast", "plus"] },
  { target = "macos-arm64", host = "macos-aarch64", command = ["cargo", "test", "-p", "mousse-helper", "--no-fail-fast", "plus"] },
]
control = [
  { name = "no-prefetch", breaks = "the next block is asked for only when the current one is gone", env = { RUSTFLAGS = '--cfg mousse_control="no-prefetch"' } },
  { name = "new-request-id-on-retry", breaks = "a retried lease request gets a new request id, so a lost answer reserves a second block", env = { RUSTFLAGS = '--cfg mousse_control="new-request-id-on-retry"' } },
  { name = "fund-two-relays", breaks = "a relay move asks Plus to fund the new relay while the old one still holds blocks", env = { RUSTFLAGS = '--cfg mousse_control="fund-two-relays"' } },
  { name = "pause-all-classes", breaks = "a failed bulk refill pauses interactive too", env = { RUSTFLAGS = '--cfg mousse_control="pause-all-classes"' } },
]

[[check]]
id = "phase4.directory"
title = "Slots per pairing from the pair secret; a removed pairing's slot and token go and its slot id stays unreadable; a lost slot write is written again; mail reaches an offline host; a swapped slot, a manifest signed by another key and a removal Plus deposited itself are refused"
plan = "docs/phase34-design.md A.5, A.6, A.13, B.12 and F.1 (E-L3)"
targets = ["windows-x64", "linux-x64"]
min_tests = 8
local = [
  { target = "windows-x64", host = "windows-x86_64", command = ["cargo", "test", "-p", "mousse-net-core", "-p", "mousse-helper", "--no-fail-fast", "--", "pairmail", "mailbox"] },
  { target = "linux-x64", host = "linux-x86_64", command = ["cargo", "test", "-p", "mousse-net-core", "-p", "mousse-helper", "--no-fail-fast", "--", "pairmail", "mailbox"] },
]
control = [
  { name = "keep-removed-slot", breaks = "a removed pairing's directory slot is not deleted", env = { RUSTFLAGS = '--cfg mousse_control="keep-removed-slot"' } },
  { name = "unpinned-manifest", breaks = "a slot's manifest counts without the pinned host's signature", env = { RUSTFLAGS = '--cfg mousse_control="unpinned-manifest"' } },
  { name = "trust-from-plus", breaks = "mail is acted on without opening it with a pairing's mail key", env = { RUSTFLAGS = '--cfg mousse_control="trust-from-plus"' } },
]
